<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة الكلمات — اسم حيوان نبات</title><link rel="stylesheet" href="./notebook-theme.css?v=20261016-4"><link rel="stylesheet" href="./notebook-fonts.css?v=20261016-typography-1"><style>main{max-width:640px!important}h1{text-align:center}#items>article{border-bottom:1px solid #9aabb1;padding:14px 4px}button{padding:10px;margin:5px;border:1px solid #8b7761;background:#e6d1a5;cursor:pointer}button:disabled{opacity:.5}small{color:#726b60}#status{padding:8px;background:#fff4d5}</style></head><body><main class="page"><div class="notebook-heading"><div class="notebook-meta"><span>الموضوع: مراجعة بنك الكلمات</span><span>للمشرف فقط</span></div><div class="notebook-subject">دفتر المراجعة ✎</div></div><h1>الكلمات المقترحة</h1><p>هذه لوحة إدارة تجريبية. لا تمنح صلاحياتها لأي لاعب.</p><button id="load">تحميل المرشحات</button><p id="status" role="status">لم يتم تحميل البيانات بعد.</p><div id="items"></div></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script><script src="./firebase-config.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let functions;const status=s=>$('status').textContent=s;async function init(){if(!window.firebase?.functions||!window.FADAWAH_FIREBASE_CONFIG?.apiKey)throw Error('Firebase غير جاهز');if(!firebase.apps.length)firebase.initializeApp(window.FADAWAH_FIREBASE_CONFIG);const user=firebase.auth().currentUser||(await firebase.auth().signInAnonymously()).user;if(!user)throw Error('لم يتم تسجيل الدخول');functions=firebase.app().functions('asia-southeast1')}async function call(name,data){return (await functions.httpsCallable(name)(data)).data}async function load(){try{status('جاري التحميل…');await init();const result=await call('listCandidateAnswers',{});$('items').replaceChildren();const rows=result.items||[];if(!rows.length){status('لا توجد كلمات معلقة للمراجعة');return}status(rows.length+' كلمة للمراجعة');for(const item of rows){const box=document.createElement('article');const heading=document.createElement('h3');heading.textContent=item.word+' — '+item.category;const detail=document.createElement('small');detail.textContent='غرف مستقلة: '+item.independentRooms+' | مرات الظهور: '+item.appearances;box.append(heading,detail);for(const [label,decision] of [['اعتماد ✓','approve'],['رفض ✗','reject']]){const btn=document.createElement('button');btn.textContent=label;btn.onclick=async()=>{if(!confirm('تأكيد قرار '+label+' للكلمة '+item.word+'؟'))return;btn.disabled=true;try{await call('moderateCandidateAnswer',{id:item.id,decision});await load()}catch(e){status('فشل القرار: '+e.message);btn.disabled=false}};box.append(btn)}$('items').append(box)}}catch(e){status('تعذر فتح المراجعة: '+e.message+' — يجب أن يكون الحساب مصرحًا له بالإشراف وأن تكون الوظائف منشورة.')}}$('load').onclick=load;})();
</script></body></html>
