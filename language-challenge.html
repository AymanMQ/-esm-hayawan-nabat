<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سهرة الكلمات — اسم حيوان نبات</title>
<style>*{box-sizing:border-box}.hide{display:none!important}.page{max-width:640px;margin:auto;padding:18px}.btn{width:100%;padding:13px;margin:8px 0;font:700 18px Tahoma;cursor:pointer}.card{padding:18px}.option{display:block;width:100%;padding:14px;margin:8px 0;text-align:right;font:600 18px Tahoma;cursor:pointer;border:1px solid #8e8576;background:#f8efd9;color:#243c60}.option:disabled{opacity:1;cursor:default}.option.correct{background:#d8eddd;border:2px solid #447c54}.option.wrong{background:#f6d8d6;border:2px solid #a74e4b}.muted{font-size:14px;color:#625a50}h1,h2{text-align:center}select{display:block;width:100%;padding:12px;font:17px Tahoma}#feedback{min-height:45px;line-height:1.9;font-weight:bold}</style>
<link rel="stylesheet" href="./notebook-theme.css?v=cairo-reset-1"><link rel="stylesheet" href="./notebook-fonts.css?v=thmanyah-like-medium-1"></head><body><main class="page">
<div class="notebook-heading"><div class="notebook-meta"><span>الموضوع: سهرة الكلمات</span><span id="date"></span></div><div class="notebook-subject">اسم حيوان نبات ✿</div></div><h1>✨ سهرة الكلمات</h1>
<section id="setup" class="card"><h2>اختر لون السهرة</h2><label for="track">المسار</label><select id="track"><option value="mixed">🎲 خلطة من كل شيء</option><option value="proverbs">🪶 أكمل المثل</option><option value="poetry">🎼 أبيات وقوافٍ</option><option value="diwaniya">🏮 ديوانية الشعر</option><option value="riddles">🧩 ألغاز أدبية</option><option value="discovered">📖 كلمات من دفتري</option><option value="general">💬 حكاية كلمة</option><option value="verbal">🔎 وصلات ومعانٍ</option></select><label for="level">مستوى الحماس</label><select id="level"><option value="1">خفيف</option><option value="2">وسط</option><option value="3">تحدٍّ قوي</option></select><p class="muted">خمس فوازير ممتعة: أمثال، أبيات، ألغاز وكلمات. نكشف حكاية الإجابة بعد كل اختيار، بلا أجواء اختبارات.</p><p id="setupNotice" class="muted" role="status"></p><button class="btn" id="start">ابدأ السهرة ✨</button><a href="./index.html">العودة للعبة الأساسية</a></section>
<section id="quiz" class="card hide"><p id="progress" class="muted"></p><h2 id="question"></h2><div id="options"></div><p id="feedback" role="status"></p><p id="source" class="muted"></p><button class="btn hide" id="next">اللغز التالي ←</button></section>
<section id="summary" class="card hide"><h2>خلصت السهرة 🎉</h2><p id="score"></p><p id="note"></p><button class="btn" id="again">سهرة ثانية</button><a href="./index.html">العودة للعبة الأساسية</a></section></main>
<script src="./game/language-questions.js?v=diwaniya-1"></script><script src="./game/discovery.js"></script><script src="./game/word-learning.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let questions=[],index=0,correct=0,answered=false;
$('date').textContent='التاريخ: '+new Intl.DateTimeFormat('ar-SA',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
function show(id){for(const name of ['setup','quiz','summary'])$(name).classList.toggle('hide',name!==id);window.scrollTo(0,0)}
function start(){const track=$('track').value;if(track==='discovered'){let history=WordDiscovery.clean();try{history=WordDiscovery.clean(JSON.parse(localStorage.getItem('eshn_discoveries_v1')||'null'))}catch{}questions=WordLearning.questionsFor(history).sort(()=>Math.random()-.5).slice(0,5);if(!questions.length){$('setupNotice').textContent='لم تكتشف بعد كلمات لها شروح في الدفتر. العب جولة أو اختر مسارًا آخر.';return}}else questions=LanguageQuestions.select(track,Number($('level').value));questions=questions.map(q=>{const order=[0,1,2,3];for(let j=3;j>0;j--){const k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]]}return {...q,choices:order.map(i=>q.choices[i]),answer:order.indexOf(q.answer)}});index=0;correct=0;show('quiz');render()}
function render(){answered=false;const q=questions[index];$('progress').textContent='الفقرة '+(index+1)+' من '+questions.length+' — '+(q.kind||'من دفتري');$('question').textContent=q.q;$('feedback').textContent='';$('source').replaceChildren();$('next').classList.add('hide');$('options').replaceChildren();q.choices.forEach((choice,i)=>{const button=document.createElement('button');button.type='button';button.className='option';button.textContent=choice;button.onclick=()=>answer(i);$('options').append(button)})}
function answer(i){if(answered)return;answered=true;const q=questions[index],right=i===q.answer;if(right)correct++;[...$('options').children].forEach((button,j)=>{button.disabled=true;if(j===q.answer)button.classList.add('correct');else if(j===i)button.classList.add('wrong')});$('feedback').textContent=(right?'🌟 أحسنت! ':'✨ الإجابة هي: '+q.choices[q.answer]+'. ')+q.why;$('source').replaceChildren();if(q.sourceTitle){const source=document.createElement(q.sourceUrl?'a':'span');source.textContent='المصدر: '+q.sourceTitle;if(q.sourceUrl){source.href=q.sourceUrl;source.target='_blank';source.rel='noopener noreferrer'}$('source').append(source)}$('next').textContent=index===questions.length-1?'عرض النتيجة 🏆':'السؤال التالي ←';$('next').classList.remove('hide')}
function next(){index++;if(index<questions.length){render();return}$('score').textContent='أبدعت في '+correct+' من '+questions.length+' فقرات';$('note').textContent='في كل سهرة حكايات جديدة، جرّب لونًا آخر من الألغاز والأمثال.';show('summary')}
const requested=new URLSearchParams(location.search).get('mode');if(requested==='discovered'||requested==='diwaniya')$('track').value=requested;$('start').onclick=start;$('next').onclick=next;$('again').onclick=()=>show('setup');
})();
</script></body></html>
