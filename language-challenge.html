<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحدي المفردات — اسم حيوان نبات</title>
<style>*{box-sizing:border-box}.hide{display:none!important}.page{max-width:640px;margin:auto;padding:18px}.btn{width:100%;padding:13px;margin:8px 0;font:700 18px Tahoma;cursor:pointer}.card{padding:18px}.option{display:block;width:100%;padding:14px;margin:8px 0;text-align:right;font:600 18px Tahoma;cursor:pointer;border:1px solid #8e8576;background:#f8efd9;color:#243c60}.option:disabled{opacity:1;cursor:default}.option.correct{background:#d8eddd;border:2px solid #447c54}.option.wrong{background:#f6d8d6;border:2px solid #a74e4b}.muted{font-size:14px;color:#625a50}h1,h2{text-align:center}select{display:block;width:100%;padding:12px;font:17px Tahoma}#feedback{min-height:45px;line-height:1.9;font-weight:bold}</style>
<link rel="stylesheet" href="./notebook-theme.css?v=cairo-reset-1"><link rel="stylesheet" href="./notebook-fonts.css?v=thmanyah-like-medium-1"></head><body><main class="page">
<div class="notebook-heading"><div class="notebook-meta"><span>الموضوع: تحدي المفردات</span><span id="date"></span></div><div class="notebook-subject">اسم حيوان نبات ✿</div></div><h1>🧠 تحدي المفردات</h1>
<section id="setup" class="card"><h2>اختر نوع التحدي</h2><label for="track">المسار</label><select id="track"><option value="mixed">تحدٍّ متنوع — كلا المسارين</option><option value="general">إثراء لغوي للجميع</option><option value="verbal">قدرات واستدلال لفظي</option></select><label for="level">درجة الصعوبة</label><select id="level"><option value="1">سهل</option><option value="2">متوسط</option><option value="3">متقدم</option></select><p class="muted">خمس أسئلة قصيرة مع شرح الإجابات. أسئلة تدريبية أصلية وليست اختبارًا رسميًا.</p><button class="btn" id="start">ابدأ التحدي ✏️</button><a href="./index.html">العودة للعبة الأساسية</a></section>
<section id="quiz" class="card hide"><p id="progress" class="muted"></p><h2 id="question"></h2><div id="options"></div><p id="feedback" role="status"></p><button class="btn hide" id="next">السؤال التالي ←</button></section>
<section id="summary" class="card hide"><h2>انتهى التحدي 🎉</h2><p id="score"></p><p id="note"></p><button class="btn" id="again">تحدٍّ جديد</button><a href="./index.html">العودة للعبة الأساسية</a></section></main>
<script src="./game/language-questions.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let questions=[],index=0,correct=0,answered=false;
$('date').textContent='التاريخ: '+new Intl.DateTimeFormat('ar-SA',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
function show(id){for(const name of ['setup','quiz','summary'])$(name).classList.toggle('hide',name!==id);window.scrollTo(0,0)}
function start(){questions=LanguageQuestions.select($('track').value,Number($('level').value));index=0;correct=0;show('quiz');render()}
function render(){answered=false;const q=questions[index];$('progress').textContent='السؤال '+(index+1)+' من '+questions.length+' — '+q.kind;$('question').textContent=q.q;$('feedback').textContent='';$('next').classList.add('hide');$('options').replaceChildren();q.choices.forEach((choice,i)=>{const button=document.createElement('button');button.type='button';button.className='option';button.textContent=choice;button.onclick=()=>answer(i);$('options').append(button)})}
function answer(i){if(answered)return;answered=true;const q=questions[index],right=i===q.answer;if(right)correct++;[...$('options').children].forEach((button,j)=>{button.disabled=true;if(j===q.answer)button.classList.add('correct');else if(j===i)button.classList.add('wrong')});$('feedback').textContent=(right?'✓ إجابة صحيحة. ':'✗ الإجابة الصحيحة: '+q.choices[q.answer]+'. ')+q.why;$('next').textContent=index===questions.length-1?'عرض النتيجة 🏆':'السؤال التالي ←';$('next').classList.remove('hide')}
function next(){index++;if(index<questions.length){render();return}$('score').textContent='أجبت إجابة صحيحة عن '+correct+' من '+questions.length;$('note').textContent='يمكنك المحاولة مجددًا بأسئلة مختلفة أو رفع الصعوبة.';show('summary')}
$('start').onclick=start;$('next').onclick=next;$('again').onclick=()=>show('setup');
})();
</script></body></html>
