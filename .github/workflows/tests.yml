name: Test game rules
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: node --check game/letters-engine.js
      - run: node --check game/tournament-bracket.js
      - run: node --check game/candidate-words.js
      - run: node --check functions/lib/candidate-words.js
      - run: node --check multiplayer-client.js
      - run: node --check solo-challenge.js
      - run: node --check functions/index.js
      - run: node --check functions/tournaments.js
      - run: node --check game/tournament-schedule.js
      - run: node -e "JSON.parse(require('fs').readFileSync('database.secure.rules.json','utf8'))"
