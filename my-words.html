<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دفتر كلماتي — اسم حيوان نبات</title>
<style>*{box-sizing:border-box}.page{max-width:650px;margin:auto;padding:18px}.card{padding:14px}.word{border-bottom:1px solid #91a7a9;padding:13px 4px;line-height:1.9}.word strong{color:#194d80;font-size:21px}.muted{font-size:14px;color:#645e56}.btn{padding:12px;width:100%;margin:8px 0;cursor:pointer}select{width:100%;padding:12px;font-size:17px}.hide{display:none!important}a{color:#254e73}</style>
<link rel="stylesheet" href="./notebook-theme.css?v=cairo-reset-1"><link rel="stylesheet" href="./notebook-fonts.css?v=thmanyah-like-medium-1"></head><body><main class="page"><div class="notebook-heading"><div class="notebook-meta"><span>الموضوع: دفتر كلماتي</span><span id="date"></span></div><div class="notebook-subject">اكتشف وتعلّم ✿</div></div><h1>📖 دفتر كلماتي</h1><p id="total" class="muted"></p><label for="category">اختر الفئة</label><select id="category"><option value="">كل الفئات</option></select><div id="words"></div><p class="muted">الكلمات محفوظة على هذا الجهاز فقط. تظهر الشروح للكلمات التي راجعنا معانيها؛ لا نخترع معاني للكلمات الأخرى.</p><button class="btn" id="review">العب بكلمات اكتشفتها ✨</button><a href="./index.html">العودة للعبة</a></main>
<script src="./game/discovery.js"></script><script src="./game/word-learning.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),discovery=window.WordDiscovery,learning=window.WordLearning;let history=discovery.clean();try{history=discovery.clean(JSON.parse(localStorage.getItem('eshn_discoveries_v1')||'null'))}catch{}
$('date').textContent='التاريخ: '+new Intl.DateTimeFormat('ar-SA',{day:'numeric',month:'long',year:'numeric'}).format(new Date());const entries=Object.values(history.entries).sort((a,b)=>a.category.localeCompare(b.category,'ar')||a.word.localeCompare(b.word,'ar'));$('total').textContent='اكتشفت '+entries.length+' كلمات مختلفة حتى الآن.';for(const cat of [...new Set(entries.map(x=>x.category))]){const opt=document.createElement('option');opt.value=cat;opt.textContent=cat;$('category').append(opt)}
function render(){const selected=$('category').value;$('words').replaceChildren();const visible=entries.filter(e=>!selected||e.category===selected);if(!visible.length){const p=document.createElement('p');p.textContent='لا توجد كلمات هنا بعد. العب جولة لاكتشاف كلمات جديدة.';$('words').append(p);return}for(const item of visible){const note=learning.noteFor(item.category,item.word),box=document.createElement('article');box.className='word';const title=document.createElement('strong');title.textContent=item.word+' — '+item.category;box.append(title);const p=document.createElement('p');p.textContent=note?note.meaning+' مثال: '+note.example:'لم نضف شرحًا موثقًا لهذه الكلمة بعد.';box.append(p);$('words').append(box)}}$('category').onchange=render;$('review').onclick=()=>{window.location.href='./language-challenge.html?mode=discovered'};render();
})();
</script></body></html>
